    <!--
      MOBILE.EDGE.1 D — EDGE-TO-EDGE ON NOTCHED IPHONES.

      `viewport-fit=cover` moves the layout viewport out to the whole physical
      screen: the notch, the Dynamic Island and the home indicator are inside it,
      and a full-bleed act paints under Safari's bars instead of stopping at a
      letterboxed rectangle. It is the half of the treatment that costs nothing;
      the other half is that every box holding TYPE must then state its own
      clearance in `env(safe-area-inset-*)`, which is what the `.cine-safe-*`
      classes and the header/footer insets do.

      THEME-COLOR: ONE STATIC BRAND VALUE, NOT A PER-SECTION ONE.
      Safari paints its chrome with this colour, so the question is whether it
      should track the act under it. TitiLinks answered this in the shipping
      code: its rebuild plan proposed a dynamic per-page value driven from the
      loaded profile theme, and what actually shipped is a single literal
      (`#0e0c09`, PublicProfile.tsx) — because the bars are only ever adjacent to
      the page's GROUND, never to an act's artwork, and a value that changes
      under scroll reads as the chrome flickering. The same holds here and more
      strongly: this page's ground is one colour at both ends. #121212 is that
      colour — it is `--background`, and it is the literal the TA.7e boot cover
      paints, so the chrome, the first paint and the page ground are one value in
      three places rather than three values to keep in sync.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/png" href="/favicon.png" />

  <body>
    <!--
      TA.7e — static first-paint cover. A full-viewport charcoal layer present in
      the very first byte of HTML, before any stylesheet or module script loads.
      It out-races every React/CSS timing window: nothing (header, footer, unstyled
      body) can paint into the viewport before the real first view is ready. Uses a
      literal #121212 (=== hsl(var(--background))) and inline styles so it is opaque
      with zero CSS, and the highest z-index so it sits above all app chrome.
      Removed once the app CSS has applied AND React has committed its first frame;
      a 4s safety timeout guarantees a JS/render failure can never leave it up.
    -->
    <div
      id="ta-boot-cover"
      aria-hidden="true"
      style="position:fixed;inset:0;z-index:2147483647;background:#121212;"
    ></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var cover = document.getElementById("ta-boot-cover");
        if (!cover) return;
        var done = false;
        var remove = function () {
          if (done) return;
          done = true;
          if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
        };
        // Exposed for tests / manual override; normal removal is driven below.
        window.__taRemoveBootCover = remove;
        var root = document.getElementById("root");
        var ready = function () {
          // Reveal only once the app stylesheet has applied (the --background
          // custom property resolves) AND React has committed its first frame —
          // so lifting the cover never exposes an unstyled page or an empty #root.
          var cssReady =
            getComputedStyle(document.documentElement)
              .getPropertyValue("--background")
              .trim() !== "";
          var reactReady = !!root && root.childElementCount > 0;
          return cssReady && reactReady;
        };
        var tick = function () {
          if (done) return;
          if (ready()) return remove();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        // Safety net — a JS/render failure must never brick the page behind the cover.
        setTimeout(remove, 4000);
      })();
    </script>
  </body>

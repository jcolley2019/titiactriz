# BUILD.GATE.1 — the same gates every session runs locally (tsc + guard), enforced
# on every push so nothing lands on main ungated. main auto-deploys via Vercel;
# this is the last mechanical check before production.
#
# FIX.CI.1 — the 393-test Playwright battery now gates too. It is split across
# eight shard jobs rather than run serially: a single-worker full battery is
# ~60-75 minutes, and eight runners bring that to roughly a quarter-hour. The
# repo is public, so Actions minutes cost nothing and the only currency spent is
# wall clock. Each shard still runs workers:1 internally — the scroll and dwell
# specs are timing-sensitive, so parallelism has to come from separate machines,
# never from contended CPU on one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run guard

  e2e:
    # Gated behind the cheap checks: eight runners should not spend a quarter of
    # an hour proving that code which does not typecheck also does not scroll.
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports. One shard failing must not cancel the other seven,
      # or a single flake hides whatever else broke.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Chromium AND WebKit. playwright.config.ts declares two projects: chromium
      # runs the battery, and webkit-iphone runs the phone snap/carousel laws
      # (PHONE_SPECS) at Joey's device truth; seo-bing's B2 test also launches
      # WebKit itself. CI.1b: installing Chromium alone left every WebKit test
      # failing at browser launch from e2d7522 (2026-08-10) until 1a2c670.
      # Firefox is not used anywhere, so it is still not installed.
      #
      # CI.INSTALL.1 — the install is cached, retried, and capped at 10 minutes.
      # Run 36892763552 showed where the time goes: the four browser downloads
      # take ~14 s on every runner, while `--with-deps` pulls 125 MB of apt
      # packages from azure.archive.ubuntu.com — 8 s on one shard, 15½ min on
      # another, and a stall past the 30-minute job budget on a third, all from
      # the same mirror. So the cache holds the browsers AND those .deb files:
      # on a hit, `install-deps` finds every package already downloaded and asks
      # the mirror for nothing but the index. The key follows the locked
      # @playwright/test version, so a Playwright bump re-downloads both.
      - name: Read the locked Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # apt keeps what it downloads in a directory the cache can save. apt
      # normally downloads as its sandbox user `_apt`, which may not be able to
      # reach a directory under /home/runner; downloading as root sidesteps that
      # on a throwaway runner.
      - name: Point apt's download directory at the cache
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          printf '%s\n' \
            "Dir::Cache::Archives \"$HOME/.cache/apt-archives/\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'APT::Sandbox::User "root";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-archives

      - name: Cache Playwright browsers and their apt packages
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/apt-archives
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # A hit already has the browsers, so only the system libraries install.
      # Three attempts with a short backoff ride out a failed download; the
      # 10-minute cap makes a stalled mirror fail the shard fast instead of
      # spending the job's 30.
      - name: Install Playwright (system deps only on a cache hit)
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            set -- npx playwright install-deps chromium webkit
          else
            set -- npx playwright install --with-deps chromium webkit
          fi
          for attempt in 1 2 3; do
            if "$@"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::'$*' failed (attempt $attempt of 3); retrying in $((attempt * 10)) s"
              sleep $((attempt * 10))
            fi
          done
          echo "::error::'$*' failed 3 times"
          exit 1

      # apt wrote the .deb files as root; hand them back so the cache can save.
      - name: Let the cache read apt's downloads
        run: sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives"

      # No serve step: playwright.config.ts owns the webServer and boots
      # `npm run dev` itself. It must be the DEV server, not a build+preview —
      # the seq-lab and reel-bakeoff QA routes exist only under import.meta.env.DEV
      # and a preview build would 404 them (28 tests in seq-lab.spec.ts alone).
      #
      # Credentials: .env is tracked and holds only publishable anon values, so
      # checkout is all the app needs to boot. The specs do read live Supabase
      # (site_settings, gallery_photos, acting_credits, social_links) — a board
      # change made in admin can turn this red with no code change.
      - name: Playwright battery (shard ${{ matrix.shard }}/8)
        run: npm test -- --shard=${{ matrix.shard }}/8

      # Traces are written from the first retry onward (trace: on-first-retry),
      # so anything that failed at least once leaves evidence. The runner is
      # destroyed on exit, so this upload is the only copy that survives.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
